name: Phoenix pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: phoenix-backend
    env:
      MONGODB_URI: mongodb://localhost:27017/phoenix_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: phoenix-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/phoenix
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}

      - name: Start backend
        working-directory: phoenix-backend
        run: |
          npm ci
          npm run build
          npm run seed:reset
          npm start &

      - name: Start frontend
        working-directory: phoenix-frontend
        run: |
          npm ci
          npm run build
          npm start &

      - name: Wait for services
        run: |
          chmod +x ./scripts/wait-for.sh ./scripts/smoke.sh
          ./scripts/wait-for.sh http://localhost:8000/api/health 30
          ./scripts/wait-for.sh http://localhost:3000 30

      - name: Run smoke test
        run: ./scripts/smoke.sh http://localhost:8000 http://localhost:3000

  deploy:
    needs: [e2e]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@34.2.0

      - name: Deploy backend
        working-directory: phoenix-backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel deploy --prod --yes

      - name: Deploy frontend
        working-directory: phoenix-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: vercel deploy --prod --yes

  verify:
    needs: [deploy]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify production deployment
        run: |
          chmod +x ./scripts/smoke.sh
          ./scripts/smoke.sh "${{ vars.BACKEND_URL }}" "${{ vars.FRONTEND_URL }}" "${{ github.sha }}"
