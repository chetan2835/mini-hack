name: Frontend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "phoenix-frontend/package-lock.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
